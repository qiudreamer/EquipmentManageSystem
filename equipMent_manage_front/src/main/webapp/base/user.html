<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理页面</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/bottom.css">

</head>
<body>
<div class="header" id="main-menu-header">
</div>
<div class="content" id="main-page-content">
    <!-- 搜索区 -->
    <header class="toolbar">
        <div id="home-input-search-box">
            <input id="searchInput" placeholder="搜索 …"/>
            <select id="searchType">
                <option value="userAccount">用户账号</option>
                <option value="userName">用户名称</option>
            </select>
            <div class="manage-button-box">
                <button id="searchBtn" onclick="searchUser()">搜索用户</button>
                <button id="addBtn" onclick="showNewUserModal()">添加用户</button>
            </div>

        </div>

    </header>

    <!-- 网格展示区 -->
    <main id="grid" class="user-grid">

        <!-- 更多行 -->
    </main>

    <!-- 分页 -->
    <footer id="pager-home"></footer>


    <!-- 弹窗结构 -->
    <div id="dlgOverlay" class="dlg-overlay">
        <div class="dlg-box">
            <h2>确认删除</h2>
            <p>删除后数据不可恢复，是否继续？</p>
            <div class="dlg-actions">
                <button id="dlgConfirm" class="dlg-btn dlg-primary">确定</button>
                <button id="dlgCancel" class="dlg-btn">取消</button>
            </div>
        </div>
    </div>

    <div id="password-overlay" class="password-overlay">
        <div id="password-modal" class="password-modal">
            <div class="password-header">
                <h3>密码展示</h3>
            </div>
            <div class="password-body">
                <p id="password-display">这里显示密码</p>
            </div>
            <div class="password-button-box">
                <button id="close-btn" class="close-btn" onclick="closePasswordOverlay(event)">取消</button>
            </div>
        </div>
    </div>

    <!-- 新建用户弹窗 -->
    <div id="new-user-overlay" class="new-user-overlay" style="display: none;">
        <div class="new-user-container">
            <h2>新建用户</h2>
            <div class="new-user-form">
                <label for="user-name">用户真实名称:(重要)</label>
                <input type="text" id="user-name" required>

                <label for="user-account">用户账号:(就是真实名称的拼音)</label>
                <input type="text" id="user-account" readonly>

                <label for="user-password">用户密码:(就是拼音+123,需要提醒用户进行修改)</label>
                <input type="text" id="user-password" readonly>

                <div class="btn-group">
                    <button id="new-confirm-button" class="btn btn-confirm" onclick="confirmButton()">确认</button>
                    <button id="generate-account" class="btn btn-get-user" onclick="generateAccountAndPasswordSubmit()">生成账号和密码</button>
                    <button id="new-cancel-button" class="btn btn-cancel" onclick="cancelButtonSubmit()">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../js/header.js"></script>
<script src="../js/getData.js"></script>
<script src="../js/showCustom.js"></script>
<script src="../js/allHref.js"></script>
<script src="../js/users.js"></script>
<script src="../js/bottom.js"></script>

<script src="../socket_js/sockjs.min.js"></script>
<script src="../socket_js/stomp.min.js"></script>

<script src="../js/socketData.js"></script>


<script>
    initSocketData()

    const mainMenuHeaderBox = document.getElementById("main-menu-header");

    addHeader("user")

    getAllUser();


</script>
</body>
</html>
