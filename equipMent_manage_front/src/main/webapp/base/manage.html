<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理页面</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/manage.css">
    <link rel="stylesheet" href="../css/bottom.css">

</head>
<body>
<div class="header" id="main-menu-header">
</div>
<div class="content" id="main-page-content">
    <!-- 搜索区 -->
    <header class="toolbar">
        <div id="home-input-search-box">
            <input id="searchInput" placeholder="搜索 …"/>
            <select id="searchType">
                <option value="equipmentName">设备名称</option>
                <option value="equipmentCode">设备编号</option>
                <option value="equipmentLabel">全部标签</option>
            </select>
            <div class="manage-button-box">
                <button id="searchBtn" onclick="searchEquipment()">搜索设备</button>
                <button onclick="addNewEquipment()">新建设备</button>
            </div>

        </div>

    </header>

    <!-- 网格展示区 -->
    <main id="grid" class="grid"></main>

    <!-- 分页 -->
    <footer id="pager-home"></footer>

    <!-- 遮罩层，初始隐藏 -->
    <div id="overlay">
        <!-- 关闭按钮 -->
        <div id="overlay-close">×</div>
        <!-- 放大区域 -->
        <div id="overlay-content"></div>
    </div>


    <!-- 弹窗结构 -->
    <div id="dlgOverlay" class="dlg-overlay">
        <div class="dlg-box">
            <h2>确认删除</h2>
            <p>删除后数据不可恢复，是否继续？</p>
            <div class="dlg-actions">
                <button id="dlgConfirm" class="dlg-btn dlg-primary">确定</button>
                <button id="dlgCancel" class="dlg-btn">取消</button>
            </div>
        </div>
    </div>

</div>
<script src="../js/header.js"></script>
<script src="../js/getData.js"></script>
<script src="../js/showCustom.js"></script>
<script src="../js/allHref.js"></script>
<script src="../js/manage.js"></script>
<script src="../js/bottom.js"></script>
<script src="../socket_js/sockjs.min.js"></script>
<script src="../socket_js/stomp.min.js"></script>

<script src="../js/socketData.js"></script>

<script>
    initSocketData()

    const mainMenuHeaderBox = document.getElementById("main-menu-header");

    addHeader("home")

    getAllEquipment();


</script>
</body>
</html>
