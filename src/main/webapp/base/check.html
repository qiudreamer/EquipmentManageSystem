<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>设备管理页面</title>
    <link href="../css/header.css" rel="stylesheet">
    <link href="../css/check.css" rel="stylesheet">
    <link href="../css/bottom.css" rel="stylesheet">

</head>
<body>
<div class="header" id="main-menu-header">
</div>
<div class="content" id="main-page-content">
    <!-- 搜索区 -->
    <header class="toolbar">
        <div id="home-input-search-box">
            <input id="searchInput" placeholder="搜索 …"/>
            <select id="searchType">
                <option value="equipmentName">用户账号</option>
                <option value="equipmentCode">设备id</option>
            </select>
            <button id="searchBtn" onclick="searchEquipment()">搜索设备</button>

        </div>

    </header>

    <!-- 网格展示区 -->
    <main class="check-grid" id="grid"></main>

    <!-- 分页 -->
    <footer id="pager-home"></footer>

    <!-- 遮罩层，初始隐藏 -->
    <div id="check-overlay">
        <!-- 关闭按钮 -->
        <div id="check-overlay-close">×</div>
        <!-- 放大区域 -->
        <div id="check-overlay-content"></div>
    </div>


</div>
<script src="../js/header.js"></script>
<script src="../js/getData.js"></script>
<script src="../js/showCustom.js"></script>
<script src="../js/allHref.js"></script>
<script src="../js/check.js"></script>
<script src="../js/bottom.js"></script>
<script src="../socket_js/sockjs.min.js"></script>
<script src="../socket_js/stomp.min.js"></script>

<script src="../js/socketData.js"></script>

<script>
    initSocketData()

    const mainMenuHeaderBox = document.getElementById("main-menu-header");

    addHeader("check")

    getAllCheckEquipment()

</script>
</body>
</html>
