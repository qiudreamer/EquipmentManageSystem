<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理页面</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/order.css">
    <link rel="stylesheet" href="../css/bottom.css">

</head>
<body>

<div class="header" id="main-menu-header">
</div>
<div class="content" id="main-page-content">
    <!-- 搜索区 -->
    <header class="toolbar">
        <div id="home-input-search-box">
            <input id="searchInput" placeholder="搜索 …"/>

            <div class="manage-button-box">
                <select id="searchType">
                    <option value="equipmentName">工单id</option>
                    <option value="equipmentCode">用户id</option>
                    <option value="equipmentLabel">设备id</option>
                </select>
                <select id="searchOrderType">
                    <option value="allEquipment">全部类型</option>
                    <option value="borrowAndReturnProblem">设备借还类型</option>
                    <option value="onOrPutProblem">设备上下架类型</option>
                    <option value="deleteEquipment">设备删除类型</option>
                    <option value="equipmentProblem">设备异常类型</option>
                </select>
                <button id="searchBtn" onclick="searchEquipment()">搜索设备</button>
            </div>

        </div>

    </header>

    <!-- 网格展示区 -->
    <div id="order-grid-box">
        <main id="order-grid" class="order-grid"></main>
    </div>


    <!-- 分页 -->
    <footer id="pager-home"></footer>


    <!-- 覆盖层 -->
    <div id="order-overlay" class="order-overlay" style="display: none;">
        <!-- 最外层的 div -->
        <div class="order-container">
            <!-- 工单标题 -->
            <div class="order-title">工单详情</div>

            <!-- 最上方的 orderId -->
            <div class="order-id">工单 ID: <span id="order-id-value"></span></div>

            <div class="order-device-img-box">
                <img id="order-device-img" src="" class="order-device-img" alt=""/>
            </div>
            <!-- 中间部分，包含设备和操作人信息 -->
            <div class="order-details">
                <!-- 操作人信息盒子 -->
                <div class="order-operator-info">
                    <div class="operator-name">操作人姓名: <span id="user-id-value"></span></div>
                    <div class="order-op-type">操作类型: <span id="op-type-value"></span></div>
                    <div class="order-order-type">工单状态: <span id="order-type-value"></span></div>
                    <div class="order-borrow-time">借出时间: <span id="borrow-time-value"></span></div>
                    <div class="order-return-time">归还时间: <span id="return-time-value"></span></div>
                </div>


                <!-- 设备信息盒子 -->
                <div class="order-device-info">
                    <div class="device-name">设备名称: <span id="device-name-value"></span></div>
                    <div class="device-code">设备编号: <span id="device-code-value"></span></div>
                    <div class="device-desc">设备简介: <span id="device-desc-value"></span></div>
                    <div class="device-tags">设备标签: <span id="device-tags-value"></span></div>
                </div>
            </div>


            <!-- 下方的取消按钮 -->
            <div class="order-cancel">
                <button id="cancel-order-view" onclick="cancelShow()">取消查看</button>
            </div>
        </div>
    </div>

</div>
<script src="../js/header.js"></script>
<script src="../js/getData.js"></script>
<script src="../js/showCustom.js"></script>
<script src="../js/allHref.js"></script>
<script src="../js/order.js"></script>
<script src="../js/bottom.js"></script>
<script src="../socket_js/sockjs.min.js"></script>
<script src="../socket_js/stomp.min.js"></script>

<script src="../js/socketData.js"></script>

<script>

    initSocketData()

    const mainMenuHeaderBox = document.getElementById("main-menu-header");

    addHeader("order")

    getAllWorkOrder()

</script>
</body>
</html>
